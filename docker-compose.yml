# Host ports are confined to the 8850-8859 range assigned to this repository.

services:
  # The forecasting harness. A batch job, not a server: it runs a backtest and
  # exits, so it publishes no ports and needs no network at all.
  playground:
    build:
      context: .
      dockerfile: Dockerfile
    image: prophet-playaround/playground:local
    init: true
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    command:
      - python
      - -m
      - playground
      - backtest
      - --dataset=peyton
      - --per-fold

  # Upstream Prophet's Jekyll documentation site under docs/, served as-is.
  # Opt-in: `docker compose --profile docs up docs`, then open
  # http://localhost:8850/prophet/ (the site keeps upstream's baseurl).
  # Gems install into a named volume on first start (a few minutes) and are
  # reused afterwards; the site itself builds into /tmp, so docs/ stays
  # read-only.
  docs:
    image: ruby:3.4
    profiles: ["docs"]
    working_dir: /srv/jekyll
    environment:
      BUNDLE_FROZEN: "true"
    command: >-
      sh -c "bundle install --quiet &&
             bundle exec jekyll serve --host 0.0.0.0 --destination /tmp/site --no-watch"
    ports:
      - "8850:4000"
    volumes:
      - ./docs:/srv/jekyll:ro
      - docs-gems:/usr/local/bundle

volumes:
  docs-gems:

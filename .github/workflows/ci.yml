# The fork dropped upstream's .github/workflows entirely, so nothing in this
# repository had ever been run by CI. This restores a pipeline sized to what
# the fork actually contains.
#
# Two jobs, deliberately split:
#   * "fast" needs no compiler and finishes in seconds, so a broken invariant
#     is reported immediately;
#   * "vendored" pays for a CmdStan build and runs upstream's own suite, to
#     catch the case where the vendored snapshot stops working on a newer
#     Python or NumPy.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: lint + fast tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint first-party code
        run: |
          ruff check playground docker-healthcheck.py
          ruff format --check playground docker-healthcheck.py
      - name: Fast suite (no Stan binary required)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest playground -q

  vendored:
    if: github.event_name == 'workflow_dispatch'
    name: vendored Prophet suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build the vendored package (compiles CmdStan and prophet.stan)
        run: python -m pip install -e python/
      - name: Upstream Prophet suite
        run: pytest python/prophet/tests python_shim -q
      - name: Slow first-party tests (real Prophet fits)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest playground -q -m slow
